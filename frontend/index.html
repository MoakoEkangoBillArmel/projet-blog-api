<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog API - Interface moderne</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>📝 Meba-Blog-API</h1>
            <p>Gérez vos articles avec style</p>
        </header>

        <main>
            <!-- Formulaire de création -->
            <section class="card form-card">
                <h2>✍️ Nouvel article</h2>
                <form id="articleForm">
                    <div class="form-group">
                        <input type="text" id="title" placeholder="Titre *" required>
                    </div>
                    <div class="form-group">
                        <textarea id="content" placeholder="Contenu"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" id="author" placeholder="Auteur *" required>
                        </div>
                        <div class="form-group">
                            <input type="text" id="category" placeholder="Catégorie">
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="text" id="tags" placeholder="Tags (séparés par des virgules)">
                    </div>
                    <button type="submit" class="btn btn-primary">Créer l'article</button>
                </form>
            </section>

            <!-- Barre de recherche et filtres -->
            <section class="card search-card">
                <h2>🔍 Recherche avancée</h2>
                <div class="search-filters">
                    <div class="form-group">
                        <input type="text" id="searchText" placeholder="Rechercher dans titre/contenu...">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" id="filterCategory" placeholder="Catégorie">
                        </div>
                        <div class="form-group">
                            <input type="text" id="filterAuthor" placeholder="Auteur">
                        </div>
                        <div class="form-group">
                            <input type="date" id="filterDate" placeholder="Date exacte">
                        </div>
                    </div>
                    <button id="searchBtn" class="btn btn-secondary">Rechercher</button>
                    <button id="resetBtn" class="btn btn-outline">Réinitialiser</button>
                </div>
            </section>

            <!-- Liste des articles avec pagination -->
            <section class="card articles-card">
                <h2>📄 Articles</h2>
                <div id="articlesList" class="articles-grid"></div>
                <div id="paginationControls" class="pagination"></div>
            </section>

            <!-- Graphique des catégories -->
            <section class="card chart-card">
                <h2>📊 Statistiques par catégorie</h2>
                <canvas id="categoryChart" width="400" height="200"></canvas>
            </section>
        </main>
    </div>

    <!-- Modal d'édition -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Modifier l'article</h2>
            <form id="editForm">
                <div class="form-group">
                    <input type="text" id="editTitle" placeholder="Titre *" required>
                </div>
                <div class="form-group">
                    <textarea id="editContent" placeholder="Contenu"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="editAuthor" placeholder="Auteur *" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="editCategory" placeholder="Catégorie">
                    </div>
                </div>
                <div class="form-group">
                    <input type="text" id="editTags" placeholder="Tags (séparés par des virgules)">
                </div>
                <input type="hidden" id="editId">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
